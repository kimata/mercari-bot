image: gitlab.green-rabbit.net:5050/kimata/local-ubuntu:260104_3efe597c

variables:
    UV_LINK_MODE: copy
    UV_CACHE_DIR: .uv-cache
    PYRIGHT_PYTHON_FORCE_VERSION: latest
    UV_HTTP_TIMEOUT: "120"

    UV_EXTRA_INDEX_URL: "http://proxy:3141/simple/"
    UV_INSECURE_HOST: "proxy"

default:
    before_script:
        - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

# NOTE: インフラ起因の一時的な失敗 (PyPI プロキシの 503 応答、runner の Pod 起動失敗、
# タイムアウト等) でパイプラインが落ちないよう、依存解決を伴うジョブは自動リトライする
# ジョブ側では extends: .retry-transient で利用する (include したファイルからも参照可)
.retry-transient:
    retry:
        max: 2
        when:
            - script_failure
            - runner_system_failure
            - stuck_or_timeout_failure

stages:
    - generate-tag
    - build
    - test
    - tag-latest
    - deploy
    - renovate

generate-tag:
    stage: generate-tag
    script:
        # NOTE: タグはイメージ内容を決める入力 (アプリ + clone する設定リポジトリ群) から
        # 決定論的に生成する。日時部分は入力の最終コミット日時 (人間向け)、末尾の入力ハッシュが
        # 一意性を担保する。内容が変わらない限りタグは同一になり、変わったら必ずタグも変わるため、
        # 設定だけの変更でも kubectl set image が確実にロールアウトする。
        - |
            INPUT_SHAS="${CI_COMMIT_SHA}"
            NEWEST_EPOCH=$(date -d "${CI_COMMIT_TIMESTAMP}" +%s)
            INPUT_REPO="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/bot-config.git"
            git clone --quiet --depth 1 "${INPUT_REPO}" .input-repo-1
            INPUT_SHAS="${INPUT_SHAS} $(git -C .input-repo-1 rev-parse HEAD)"
            REPO_EPOCH=$(git -C .input-repo-1 log -1 --format=%ct)
            if [ "${REPO_EPOCH}" -gt "${NEWEST_EPOCH}" ]; then NEWEST_EPOCH="${REPO_EPOCH}"; fi
            rm -rf .input-repo-1
            INPUT_REPO="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/font.git"
            git clone --quiet --depth 1 "${INPUT_REPO}" .input-repo-2
            INPUT_SHAS="${INPUT_SHAS} $(git -C .input-repo-2 rev-parse HEAD)"
            REPO_EPOCH=$(git -C .input-repo-2 log -1 --format=%ct)
            if [ "${REPO_EPOCH}" -gt "${NEWEST_EPOCH}" ]; then NEWEST_EPOCH="${REPO_EPOCH}"; fi
            rm -rf .input-repo-2
            INPUT_HASH=$(echo "${INPUT_SHAS}" | sha1sum | cut -c1-7)
            TAG_DATE=$(date -d "@${NEWEST_EPOCH}" +%y%m%d-%H%M)
            echo "TAG=${TAG_DATE}_${CI_COMMIT_SHORT_SHA}_i${INPUT_HASH}" > tag.env
            echo "IMAGE_BUILD_DATE=$(date -d "@${NEWEST_EPOCH}" --iso-8601=seconds)" >> tag.env
            cat tag.env
    artifacts:
        reports:
            dotenv: tag.env
        expire_in: 1 hour

build-image:
    stage: build

    needs:
        - generate-tag

    variables:
        BUILDER: builder-${CI_PROJECT_NAME}

    script:
        - 'echo "Building: ${CI_REGISTRY_IMAGE}:${TAG}"'

        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/bot-config.git
        - mv bot-config/mercari-bot.yaml config.yaml
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/font.git private_font
        - mv private_font/* font

        - docker buildx create --driver docker-container --name ${BUILDER} --use --config /etc/buildkitd.toml
        - docker buildx use ${BUILDER}
        - docker buildx inspect --bootstrap
        - >
            docker buildx build
            --provenance=false
            --progress=plain
            --platform linux/amd64
            --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}:cache
            --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}:latest
            --cache-to type=inline
            --cache-to type=registry,ref=${CI_REGISTRY_IMAGE}:cache,mode=max
            --build-arg IMAGE_BUILD_DATE=${IMAGE_BUILD_DATE}
            --build-arg CHROME_CACHE_BUSTER=$(date +%Y%W)
            --tag ${CI_REGISTRY_IMAGE}:${TAG}
            --push .

test-typecheck:
    stage: test
    extends: .retry-transient

    needs: []

    before_script:
        - uv sync --locked --no-editable

    script:
        - uv run python -m pyright src/
        - uv run mypy src/
        - uv run ty check src/

    cache:
        - key:
              files:
                  - uv.lock
          fallback_keys:
              - uv-cache-${CI_PROJECT_ID}
          paths:
              - ${UV_CACHE_DIR}
              - .mypy_cache/

test-pytest:
    stage: test
    extends: .retry-transient

    needs: []

    before_script:
        - uv sync --locked --no-editable

    script:
        - uv run pytest

    coverage: '/TOTAL.*\s+(\d+%)/'

    cache:
        - key:
              files:
                  - uv.lock
          fallback_keys:
              - uv-cache-${CI_PROJECT_ID}
          paths:
              - ${UV_CACHE_DIR}

    artifacts:
        when: always
        paths:
            - reports/**
        reports:
            junit: reports/junit-report.xml
            coverage_report:
                coverage_format: cobertura
                path: reports/coverage.xml

tag-latest:
    stage: tag-latest

    needs:
        - generate-tag
        # NOTE: docker ベースのテストジョブが無い構成では、build-image を明示的に
        # 待たないとイメージ push 前に実行されてしまう
        - job: build-image
          artifacts: false
        - job: test-typecheck
          artifacts: false
        - job: test-pytest
          artifacts: false
        - job: test-smoke
          artifacts: false
        - job: test-docker
          artifacts: false

    script:
        - 'echo "Tagging ${CI_REGISTRY_IMAGE}:${TAG} as latest"'
        - docker pull ${CI_REGISTRY_IMAGE}:${TAG}
        - docker tag ${CI_REGISTRY_IMAGE}:${TAG} ${CI_REGISTRY_IMAGE}:latest
        - docker push ${CI_REGISTRY_IMAGE}:latest

    rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          when: never
        - when: on_success

deploy:
    stage: deploy

    needs:
        - generate-tag
        # NOTE: docker ベースのテストジョブが無い構成では、build-image を明示的に
        # 待たないとイメージ push 前に実行されてしまう
        - job: build-image
          artifacts: false
        - job: test-typecheck
          artifacts: false
        - job: test-pytest
          artifacts: false
        - job: test-smoke
          artifacts: false
        - job: test-docker
          artifacts: false

    image:
        name: gitlab.green-rabbit.net:5050/kimata/local-kubectl:250715_c88f3965

    before_script: []

    script:
        - 'IMAGE="${CI_REGISTRY_IMAGE}:${TAG}"'
        - 'echo "Deploying image: $IMAGE"'

        - kubectl config get-contexts

        - echo "OK. The CronJob references latest, so no action is needed."

        - 'echo "✓ All deployments updated successfully to $TAG"'

    rules:
        # NOTE: 自動実行ではデプロイしない
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: never
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          when: never
        - when: on_success

renovate:
    stage: renovate
    extends: .retry-transient
    dependencies: []
    resource_group: renovate
    image:
        name: gitlab.green-rabbit.net:5050/kimata/local-renovate:260104_3da7b77b

    before_script: []

    variables:
        RENOVATE_CACHE_DIR: .renovate-cache
        LOG_LEVEL: info

    script:
        - renovate --platform gitlab --token ${RENOVATE_TOKEN} --endpoint ${CI_SERVER_URL}/api/v4 ${CI_PROJECT_PATH}

    cache:
        key: renovate-${CI_PROJECT_ID}
        paths:
            - ${RENOVATE_CACHE_DIR}

    rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          when: never
        - if: $CI_PIPELINE_SOURCE == "schedule"
        # NOTE: trigger 起動 (多プロジェクトパイプライン等) では changes が常に true と
        # 評価されるため、push 起動に限定する
        - if: $CI_PIPELINE_SOURCE == "push"
          changes:
              - renovate.json

# プロジェクト固有ジョブ（py-project は触らない）
include:
    - local: .gitlab/ci-local.yml
